name: Test Liboqs on Android

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  UnitTest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
      - name: Make scripts executable
        run: chmod +x gradlew liboqs-android/init-prebuilt-liboqs.sh
      - name: Initialize prebuilt liboqs (x86_64)
        env:
          ABIS: x86_64
        run: bash liboqs-android/init-prebuilt-liboqs.sh
      - name: Unit tests
        run: ./gradlew test

  BuildArtifacts:
    needs: UnitTest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
      - name: Make scripts executable
        run: chmod +x gradlew liboqs-android/init-prebuilt-liboqs.sh
      - name: Initialize prebuilt liboqs (all ABIs)
        run: bash liboqs-android/init-prebuilt-liboqs.sh
      - name: Build with Gradle
        run: ./gradlew assembleDebug assembleDebugAndroidTest
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Debug Apk
          path: app/build/outputs/apk/debug/app-debug.apk

  InstrumentedTests:
    needs: BuildArtifacts
    runs-on: ubuntu-latest
    strategy:
      matrix:
        api-level: [21]
        arch: [x86_64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Make scripts executable
        run: chmod +x ./gradlew ./liboqs-android/init-prebuilt-liboqs.sh ./.github/logTest.sh
      - name: Initialize prebuilt liboqs (${{ matrix.arch }})
        env:
          ABIS: ${{ matrix.arch }}
        run: bash liboqs-android/init-prebuilt-liboqs.sh
      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: ${{ matrix.arch }}
          script: bash .github/logTest.sh
