// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:4.1.0"

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

def findInstalledNdkPath = {
    for (String envVar : ['ANDROID_NDK_LATEST_HOME', 'ANDROID_NDK_HOME', 'ANDROID_NDK_ROOT']) {
        def val = System.getenv(envVar)?.trim()
        if (val && new File(val, 'build/cmake/android.toolchain.cmake').exists()) {
            return val
        }
    }
    def sdkDirCandidates = [
            System.getenv('ANDROID_SDK_ROOT'),
            System.getenv('ANDROID_HOME')
    ]
    def localPropsFile = rootProject.file('local.properties')
    if (localPropsFile.exists()) {
        def props = new Properties()
        localPropsFile.withInputStream { props.load(it) }
        def ndkProp = props.getProperty('ndk.dir')?.trim()
        if (ndkProp && new File(ndkProp, 'build/cmake/android.toolchain.cmake').exists()) {
            return ndkProp
        }
        def sdkProp = props.getProperty('sdk.dir')?.trim()
        if (sdkProp) {
            sdkDirCandidates << sdkProp
        }
    }
    def localAppData = System.getenv('LOCALAPPDATA')
    if (localAppData) {
        sdkDirCandidates << new File(localAppData, 'Android/Sdk').absolutePath
    }
    for (String candidate : sdkDirCandidates) {
        if (!candidate) continue
        def sdkDir = new File(candidate)
        def ndkBundle = new File(sdkDir, 'ndk-bundle')
        if (new File(ndkBundle, 'build/cmake/android.toolchain.cmake').exists()) {
            return ndkBundle.absolutePath
        }
        def ndkDir = new File(sdkDir, 'ndk')
        if (ndkDir.isDirectory()) {
            def dirs = ndkDir.listFiles()?.findAll {
                it.isDirectory() && new File(it, 'build/cmake/android.toolchain.cmake').exists()
            }?.sort { a, b ->
                def va = a.name.tokenize('.').collect { it.isInteger() ? it.toInteger() : 0 }
                def vb = b.name.tokenize('.').collect { it.isInteger() ? it.toInteger() : 0 }
                for (int i = 0; i < Math.max(va.size(), vb.size()); i++) {
                    int pa = i < va.size() ? va[i] : 0
                    int pb = i < vb.size() ? vb[i] : 0
                    if (pa != pb) return pa <=> pb
                }
                return a.name <=> b.name
            }
            if (dirs && !dirs.isEmpty()) {
                return dirs.last().absolutePath
            }
        }
    }
    return null
}

ext.detectedNdkPath = findInstalledNdkPath()

task clean(type: Delete) {
    delete rootProject.buildDir
}