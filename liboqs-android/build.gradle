plugins {
    id 'com.android.library'
}

def supportedAbis = ['armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64']
def requestedAbisProp = project.findProperty('abis')?.toString()?.trim()
def requestedAbisEnv = System.getenv('ABIS')?.trim()
def requestedAbisRaw = requestedAbisProp ?: requestedAbisEnv
def targetAbis = requestedAbisRaw
        ? requestedAbisRaw.split(/[\s,]+/).findAll { it }
        : (supportedAbis.findAll { file("jni/jniLibs/${it}/liboqs.so").exists() } ?: supportedAbis)

def isWindows = System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('windows')
def gitBash = new File('C:/Program Files/Git/bin/bash.exe')
def bashExecutable = isWindows && gitBash.exists() ? gitBash.absolutePath : 'bash'

task initPrebuiltLiboqs(type: Exec) {
    description = 'Fetches and builds liboqs and liboqs-java native/Java sources if missing.'
    workingDir = projectDir
    commandLine bashExecutable, 'init-prebuilt-liboqs.sh'
    doFirst {
        environment 'ABIS', targetAbis.join(' ')
        if (project.android.sdkDirectory != null) {
            environment 'ANDROID_SDK_ROOT', project.android.sdkDirectory.absolutePath
        }
    }
}

def hasPrebuiltOqs = {
    file('jni/include/oqs/oqs.h').exists() &&
            (file('jni/jni').listFiles()?.any { it.name.endsWith('.c') } ?: false) &&
            file('src/main/java/org/openquantumsafe/Common.java').exists() &&
            targetAbis.every { file("jni/jniLibs/${it}/liboqs.so").exists() }
}

afterEvaluate {
    tasks.named('preBuild').configure {
        if (!hasPrebuiltOqs()) {
            dependsOn initPrebuiltLiboqs
        }
    }
}

android {
    compileSdkVersion 30
    buildToolsVersion "30.0.3"

    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 30
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"

        // https://developer.android.com/ndk/guides/abis#gc
        ndk {
            abiFilters(*targetAbis)
        }
    }

    buildTypes {
        release {
            debuggable true
            jniDebuggable true
            zipAlignEnabled true
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    externalNativeBuild {
        ndkBuild {
            // Tells Gradle to put outputs from external native
            // builds in the path specified below.
            buildStagingDirectory "./outputs/ndk-build"
            path 'jni/Android.mk'
            // Verbose: https://stackoverflow.com/a/44578257/8524651
        }
    }

    // Needed after adding junit-jupiter: https://stackoverflow.com/questions/44342455/more-than-one-file-was-found-with-os-independent-path-meta-inf-license
    packagingOptions {
        exclude 'META-INF/DEPENDENCIES'
        exclude 'META-INF/LICENSE.md'
        exclude 'META-INF/LICENSE-notice.md'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.2.0'
    implementation 'com.google.android.material:material:1.3.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.0.4'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'org.junit.jupiter:junit-jupiter-api:5.6.2'
    androidTestImplementation 'org.junit.jupiter:junit-jupiter-params:5.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.3.0'
}
